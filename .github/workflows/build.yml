name: Build Extension

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension name (e.g., redis, imagick)'
        required: true
        type: string
      extension_version:
        description: 'Extension version/tag (e.g., 6.0.2, v3.8.0)'
        required: true
        type: string
      php_versions:
        description: 'PHP versions (comma-separated, e.g., 8.2,8.3,8.4 or "all")'
        required: false
        default: 'all'
        type: string
      platforms:
        description: 'Platforms (comma-separated, e.g., alpine,debian or "all")'
        required: false
        default: 'all'
        type: string
      architectures:
        description: 'Architectures (comma-separated, e.g., amd64,arm64 or "all")'
        required: false
        default: 'all'
        type: string
      create_release:
        description: 'Create a GitHub release with artifacts'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      extension:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      architectures:
        required: false
        type: string
        default: 'all'
      create_release:
        required: false
        type: boolean
        default: true
      runner:
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate build matrix
        id: matrix
        run: |
          EXT="${{ inputs.extension }}"
          PHP_VERS="${{ inputs.php_versions || 'all' }}"
          PLATFORMS="${{ inputs.platforms || 'all' }}"
          ARCHS="${{ inputs.architectures || 'all' }}"
          
          # Get PHP versions
          if [[ "$PHP_VERS" == "all" ]]; then
            PHP_VERSIONS=$(jq -c '.php_versions' extensions.json)
          else
            PHP_VERSIONS=$(echo "$PHP_VERS" | jq -Rc 'split(",")')
          fi
          
          # Get architectures
          if [[ "$ARCHS" == "all" ]]; then
            ARCHITECTURES=$(jq -c '.architectures' extensions.json)
          else
            ARCHITECTURES=$(echo "$ARCHS" | jq -Rc 'split(",")')
          fi
          
          # Build matrix
          MATRIX='{"include":[]}'
          
          # Alpine builds
          if [[ "$PLATFORMS" == "all" || "$PLATFORMS" == *"alpine"* ]]; then
            for php in $(echo "$PHP_VERSIONS" | jq -r '.[]'); do
              for alpine in $(jq -r '.platforms.alpine.versions[]' extensions.json); do
                for arch in $(echo "$ARCHITECTURES" | jq -r '.[]'); do
                  MATRIX=$(echo "$MATRIX" | jq --arg php "$php" --arg os "alpine" --arg osv "$alpine" --arg arch "$arch" \
                    '.include += [{"php_version": $php, "platform": $os, "platform_version": $osv, "arch": $arch}]')
                done
              done
            done
          fi
          
          # Debian builds
          if [[ "$PLATFORMS" == "all" || "$PLATFORMS" == *"debian"* ]]; then
            for php in $(echo "$PHP_VERSIONS" | jq -r '.[]'); do
              for debian in $(jq -r '.platforms.debian.versions[]' extensions.json); do
                for arch in $(echo "$ARCHITECTURES" | jq -r '.[]'); do
                  MATRIX=$(echo "$MATRIX" | jq --arg php "$php" --arg os "debian" --arg osv "$debian" --arg arch "$arch" \
                    '.include += [{"php_version": $php, "platform": $os, "platform_version": $osv, "arch": $arch}]')
                done
              done
            done
          fi
          
          echo "matrix=$(echo "$MATRIX" | jq -c)" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"

  build:
    needs: prepare
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Read extension config
        id: config
        run: |
          EXT="${{ inputs.extension }}"
          PECL_NAME=$(jq -r ".extensions.${EXT}.pecl_name" extensions.json)
          BUILD_DEPS=$(jq -r ".extensions.${EXT}.dependencies.${{ matrix.platform }}.build // [] | join(\" \")" extensions.json)
          RUNTIME_DEPS=$(jq -r ".extensions.${EXT}.dependencies.${{ matrix.platform }}.runtime // [] | join(\" \")" extensions.json)
          
          echo "pecl_name=${PECL_NAME}" >> $GITHUB_OUTPUT
          echo "build_deps=${BUILD_DEPS}" >> $GITHUB_OUTPUT
          echo "runtime_deps=${RUNTIME_DEPS}" >> $GITHUB_OUTPUT

      - name: Build extension
        id: build
        run: |
          chmod +x scripts/build.sh
          
          # Determine channel based on version format
          VERSION="${{ inputs.extension_version }}"
          if [[ "$VERSION" == dev-* ]]; then
            CHANNEL="dev"
          else
            CHANNEL="release"
          fi
          
          ./scripts/build.sh \
            "${{ inputs.extension }}" \
            "${{ matrix.php_version }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.platform_version }}" \
            "${{ inputs.extension_version }}" \
            "${{ matrix.arch }}" \
            "${CHANNEL}"
          
          # Check if artifact was generated
          ARTIFACT_DIR="output/${{ inputs.extension }}/${{ matrix.php_version }}/${{ matrix.platform }}/${{ matrix.platform_version }}/${{ matrix.arch }}"
          if [ -d "$ARTIFACT_DIR" ] && ls "$ARTIFACT_DIR"/*.so 1>/dev/null 2>&1; then
            echo "artifact_exists=true" >> $GITHUB_OUTPUT
          else
            echo "artifact_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create artifact archive
        if: steps.build.outputs.artifact_exists == 'true'
        run: |
          EXT="${{ inputs.extension }}"
          EXT_VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ inputs.extension_version }}")
          ARTIFACT_NAME="${EXT}-${EXT_VERSION}-php${{ matrix.php_version }}-${{ matrix.platform }}-${{ matrix.platform_version }}-${{ matrix.arch }}"
          cd output/${{ inputs.extension }}/${{ matrix.php_version }}/${{ matrix.platform }}/${{ matrix.platform_version }}/${{ matrix.arch }}
          tar -czvf "${ARTIFACT_NAME}.tar.gz" *.so metadata.json libs/ 2>/dev/null || tar -czvf "${ARTIFACT_NAME}.tar.gz" *.so metadata.json
          mv "${ARTIFACT_NAME}.tar.gz" "${{ github.workspace }}/"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        if: steps.build.outputs.artifact_exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          retention-days: 90

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: report-${{ inputs.extension }}-${{ matrix.php_version }}-${{ matrix.platform }}-${{ matrix.platform_version }}-${{ matrix.arch }}
          path: reports/
          retention-days: 90

  collect-artifacts:
    needs: build
    if: always()
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts/

      - name: Prepare release artifacts
        id: prepare
        run: |
          EXT="${{ inputs.extension }}"
          VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ inputs.extension_version }}")
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT
          
          mkdir -p release
          find artifacts/ -name "*.tar.gz" -exec cp {} release/ \; 2>/dev/null || true
          if [ -d release ] && [ "$(ls -A release 2>/dev/null)" ]; then
            echo "Collected artifacts:"
            ls -la release/
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "No artifacts collected"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload combined artifacts
        if: steps.prepare.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.extension }}-${{ steps.prepare.outputs.clean_version }}-all-builds
          path: release/
          retention-days: 90

      - name: Aggregate build reports
        id: aggregate
        run: |
          # Collect all JSON reports
          mkdir -p dataset
          
          # Find all report JSON files
          REPORTS=$(find artifacts/ -name "*.json" -path "*/reports/*" 2>/dev/null || true)
          
          if [ -z "$REPORTS" ]; then
            echo "No reports found"
            echo "has_reports=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found reports:"
          echo "$REPORTS"
          
          # Merge all reports into a single JSON array
          jq -s '.' $REPORTS > dataset/latest.json
          
          # Create timestamped version organized by year
          YEAR=$(date -u +"%Y")
          TIMESTAMP=$(date -u +"%m-%d")
          mkdir -p "dataset/${YEAR}"
          cp dataset/latest.json "dataset/${YEAR}/${TIMESTAMP}.json"
          
          echo "has_reports=true" >> $GITHUB_OUTPUT
          echo "year=${YEAR}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          
          echo "Aggregated $(jq length dataset/latest.json) reports"
          jq '.' dataset/latest.json

      - name: Push to dataset branch
        if: steps.aggregate.outputs.has_reports == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Try to fetch the dataset branch
          if git fetch origin dataset:dataset 2>/dev/null; then
            echo "Dataset branch exists, checking out"
            git checkout dataset
          else
            echo "Dataset branch does not exist, creating orphan branch"
            git checkout --orphan dataset
            git rm -rf . 2>/dev/null || true
          fi
          
          # Clean workspace except dataset directory
          git clean -fdx -e dataset
          
          # Move dataset files to root, preserving directory structure
          cp dataset/latest.json . 2>/dev/null || true
          mkdir -p ${{ steps.aggregate.outputs.year }}
          cp dataset/${{ steps.aggregate.outputs.year }}/*.json ${{ steps.aggregate.outputs.year }}/ 2>/dev/null || true
          rm -rf dataset
          
          # Add and commit
          git add latest.json ${{ steps.aggregate.outputs.year }}/
          git commit -m "Update build reports - ${{ steps.aggregate.outputs.year }}-${{ steps.aggregate.outputs.timestamp }}" -m "Extension: ${{ inputs.extension }} v${{ steps.prepare.outputs.clean_version }}" || echo "No changes to commit"
          
          # Push to dataset branch
          git push origin dataset

      - name: Create GitHub Release
        if: steps.prepare.outputs.has_artifacts == 'true' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT="${{ inputs.extension }}"
          VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ inputs.extension_version }}")
          RELEASE_TAG="${EXT}-${VERSION}"
          
          # Delete existing release if it exists
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          git push origin --delete "$RELEASE_TAG" 2>/dev/null || true
          
          # Create release notes
          cat > release_notes.md << EOF
          # ${EXT} ${VERSION}
          
          Pre-compiled PHP extension binaries.
          
          ## Supported Configurations
          
          - **PHP Versions**: $(jq -r '.php_versions | join(", ")' extensions.json)
          - **Architectures**: $(jq -r '.architectures | join(", ")' extensions.json)
          - **Alpine Linux**: $(jq -r '.platforms.alpine.versions | join(", ")' extensions.json)
          - **Debian**: $(jq -r '.platforms.debian.versions | join(", ")' extensions.json)
          
          ## Installation
          
          \`\`\`bash
          tar -xzf ${EXT}-${VERSION}-php<version>-<platform>-<platform_version>-<arch>.tar.gz
          cp ${EXT}.so \$(php -r "echo ini_get('extension_dir');")
          echo "extension=${EXT}.so" >> \$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | tr -d ' ')
          \`\`\`
          
          Check \`metadata.json\` inside each archive for runtime dependencies.
          
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          # Create release with artifacts
          gh release create "$RELEASE_TAG" \
            --title "${EXT} ${VERSION}" \
            --notes-file release_notes.md \
            release/*.tar.gz
