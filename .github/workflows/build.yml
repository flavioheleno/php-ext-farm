name: Build Extension

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension name (e.g., redis, imagick)'
        required: true
        type: string
      extension_version:
        description: 'Extension version/tag (e.g., 6.0.2, v3.8.0)'
        required: true
        type: string
      php_versions:
        description: 'PHP versions (comma-separated, e.g., 8.2,8.3,8.4 or "all")'
        required: false
        default: 'all'
        type: string
      platforms:
        description: 'Platforms (comma-separated, e.g., alpine,debian or "all")'
        required: false
        default: 'all'
        type: string
      create_release:
        description: 'Create a GitHub release with artifacts'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      extension:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      create_release:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate build matrix
        id: matrix
        run: |
          EXT="${{ inputs.extension }}"
          PHP_VERS="${{ inputs.php_versions || 'all' }}"
          PLATFORMS="${{ inputs.platforms || 'all' }}"
          
          # Get PHP versions
          if [[ "$PHP_VERS" == "all" ]]; then
            PHP_VERSIONS=$(jq -c '.php_versions' extensions.json)
          else
            PHP_VERSIONS=$(echo "$PHP_VERS" | jq -Rc 'split(",")')
          fi
          
          # Build matrix
          MATRIX='{"include":[]}'
          
          # Alpine builds
          if [[ "$PLATFORMS" == "all" || "$PLATFORMS" == *"alpine"* ]]; then
            for php in $(echo "$PHP_VERSIONS" | jq -r '.[]'); do
              for alpine in $(jq -r '.platforms.alpine.versions[]' extensions.json); do
                MATRIX=$(echo "$MATRIX" | jq --arg php "$php" --arg os "alpine" --arg osv "$alpine" \
                  '.include += [{"php_version": $php, "platform": $os, "platform_version": $osv}]')
              done
            done
          fi
          
          # Debian builds
          if [[ "$PLATFORMS" == "all" || "$PLATFORMS" == *"debian"* ]]; then
            for php in $(echo "$PHP_VERSIONS" | jq -r '.[]'); do
              for debian in $(jq -r '.platforms.debian.versions[]' extensions.json); do
                MATRIX=$(echo "$MATRIX" | jq --arg php "$php" --arg os "debian" --arg osv "$debian" \
                  '.include += [{"php_version": $php, "platform": $os, "platform_version": $osv}]')
              done
            done
          fi
          
          echo "matrix=$(echo "$MATRIX" | jq -c)" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Read extension config
        id: config
        run: |
          EXT="${{ inputs.extension }}"
          PECL_NAME=$(jq -r ".extensions.${EXT}.pecl_name" extensions.json)
          BUILD_DEPS=$(jq -r ".extensions.${EXT}.dependencies.${{ matrix.platform }}.build | join(\" \")" extensions.json)
          RUNTIME_DEPS=$(jq -r ".extensions.${EXT}.dependencies.${{ matrix.platform }}.runtime | join(\" \")" extensions.json)
          
          echo "pecl_name=${PECL_NAME}" >> $GITHUB_OUTPUT
          echo "build_deps=${BUILD_DEPS}" >> $GITHUB_OUTPUT
          echo "runtime_deps=${RUNTIME_DEPS}" >> $GITHUB_OUTPUT

      - name: Build extension
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh \
            "${{ inputs.extension }}" \
            "${{ matrix.php_version }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.platform_version }}" \
            "${{ inputs.extension_version }}"

      - name: Create artifact archive
        run: |
          EXT="${{ inputs.extension }}"
          EXT_VERSION="${{ inputs.extension_version }}"
          # Strip extension name prefix from version if present (e.g., "yar-2.3.3" -> "2.3.3")
          EXT_VERSION="${EXT_VERSION#${EXT}-}"
          # Also strip common prefixes like "v" or "release-"
          EXT_VERSION="${EXT_VERSION#v}"
          EXT_VERSION="${EXT_VERSION#release-}"
          EXT_VERSION="${EXT_VERSION#release_}"
          EXT_VERSION="${EXT_VERSION//_/.}"
          ARTIFACT_NAME="${EXT}-${EXT_VERSION}-php${{ matrix.php_version }}-${{ matrix.platform }}-${{ matrix.platform_version }}"
          cd output/${{ inputs.extension }}/${{ matrix.php_version }}/${{ matrix.platform }}/${{ matrix.platform_version }}
          tar -czvf "${ARTIFACT_NAME}.tar.gz" *.so metadata.json
          mv "${ARTIFACT_NAME}.tar.gz" "${{ github.workspace }}/"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          retention-days: 90

  collect-artifacts:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts/

      - name: Prepare release artifacts
        id: prepare
        run: |
          EXT="${{ inputs.extension }}"
          VERSION="${{ inputs.extension_version }}"
          # Strip extension name prefix from version if present (e.g., "yar-2.3.3" -> "2.3.3")
          VERSION="${VERSION#${EXT}-}"
          # Also strip common prefixes like "v" or "release-"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#release-}"
          VERSION="${VERSION#release_}"
          VERSION="${VERSION//_/.}"
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT
          
          mkdir -p release
          find artifacts/ -name "*.tar.gz" -exec cp {} release/ \; 2>/dev/null || true
          if [ -d release ] && [ "$(ls -A release 2>/dev/null)" ]; then
            echo "Collected artifacts:"
            ls -la release/
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "No artifacts collected"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload combined artifacts
        if: steps.prepare.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.extension }}-${{ steps.prepare.outputs.clean_version }}-all-builds
          path: release/
          retention-days: 90

      - name: Create GitHub Release
        if: steps.prepare.outputs.has_artifacts == 'true' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT="${{ inputs.extension }}"
          VERSION="${{ inputs.extension_version }}"
          # Strip extension name prefix from version if present (e.g., "yar-2.3.3" -> "2.3.3")
          VERSION="${VERSION#${EXT}-}"
          # Also strip common prefixes like "v" or "release-"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#release-}"
          VERSION="${VERSION#release_}"
          VERSION="${VERSION//_/.}"
          RELEASE_TAG="${EXT}-${VERSION}"
          
          # Delete existing release if it exists
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          git push origin --delete "$RELEASE_TAG" 2>/dev/null || true
          
          # Create release notes
          cat > release_notes.md << EOF
          # ${EXT} ${VERSION}
          
          Pre-compiled PHP extension binaries.
          
          ## Supported Configurations
          
          - **PHP Versions**: $(jq -r '.php_versions | join(", ")' extensions.json)
          - **Alpine Linux**: $(jq -r '.platforms.alpine.versions | join(", ")' extensions.json)
          - **Debian**: $(jq -r '.platforms.debian.versions | join(", ")' extensions.json)
          
          ## Installation
          
          \`\`\`bash
          tar -xzf ${EXT}-${VERSION}-php<version>-<platform>-<platform_version>.tar.gz
          cp ${EXT}.so \$(php -r "echo ini_get('extension_dir');")
          echo "extension=${EXT}.so" >> \$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | tr -d ' ')
          \`\`\`
          
          Check \`metadata.json\` inside each archive for runtime dependencies.
          
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          # Create release with artifacts
          gh release create "$RELEASE_TAG" \
            --title "${EXT} ${VERSION}" \
            --notes-file release_notes.md \
            release/*.tar.gz
