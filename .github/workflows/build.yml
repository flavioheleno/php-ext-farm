name: Build Extension

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension name (e.g., redis, imagick)'
        required: true
        type: string
      extension_version:
        description: 'Extension version/tag (e.g., 6.0.2, v3.8.0) - leave empty to use latest'
        required: false
        default: ''
        type: string
      php_versions:
        description: 'PHP versions (comma-separated, e.g., 8.2,8.3,8.4 or "all")'
        required: false
        default: 'all'
        type: string
      platforms:
        description: 'Platforms (comma-separated, e.g., alpine,debian or "all")'
        required: false
        default: 'all'
        type: string
      architectures:
        description: 'Architectures (comma-separated, e.g., amd64,arm64 or "all")'
        required: false
        default: 'all'
        type: string
      create_release:
        description: 'Create a GitHub release with artifacts'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      extension:
        required: true
        type: string
      extension_version:
        required: true
        type: string
      architectures:
        required: false
        type: string
        default: 'all'
      create_release:
        required: false
        type: boolean
        default: true
      runner:
        required: false
        type: string
        default: 'ubuntu-latest'

# Prevent concurrent builds of the same extension version
concurrency:
  group: build-${{ inputs.extension }}-${{ inputs.extension_version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      extension_version: ${{ steps.version.outputs.extension_version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve extension version
        id: version
        run: |
          VERSION="${{ inputs.extension_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r ".extensions.\"${{ inputs.extension }}\".latest_version // empty" extensions.json)
            if [ -z "$VERSION" ]; then
              echo "Error: No version provided and no latest_version found for extension '${{ inputs.extension }}'"
              exit 1
            fi
            echo "Using latest_version from extensions.json: $VERSION"
          fi
          echo "extension_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate build matrix
        id: matrix
        run: |
          # Generate entire matrix in a single jq call for efficiency
          MATRIX=$(jq -c -n --arg php_vers "${{ inputs.php_versions || 'all' }}" \
                        --arg platforms "${{ inputs.platforms || 'all' }}" \
                        --arg archs "${{ inputs.architectures || 'all' }}" \
                        --slurpfile php_versions php-versions.json \
                        --slurpfile os_versions os-versions.json \
                        --slurpfile extensions extensions.json '
            # Parse inputs
            (if $php_vers == "all" then ($php_versions[0] | keys) else ($php_vers | split(",")) end) as $php_list |
            (if $archs == "all" then $extensions[0].architectures else ($archs | split(",")) end) as $architectures |
            (if $platforms == "all" then ["alpine", "debian"] else ($platforms | split(",")) end) as $platform_list |

            # Helper function to check if combination is excluded
            def is_excluded($platform; $osv; $arch):
              $os_versions[0][$platform].exclude // [] |
              any(. as $excl | ($excl.version == $osv) and ($excl.arch == $arch));

            # Generate matrix with exclude filtering
            {include: [
              # Alpine builds
              if ($platform_list | index("alpine")) then
                $os_versions[0].alpine.versions[] as $osv |
                $php_list[] as $php |
                $architectures[] as $arch |
                select(is_excluded("alpine"; $osv; $arch) | not) |
                {php_version: $php, platform: "alpine", platform_version: $osv, arch: $arch}
              else empty end,

              # Debian builds
              if ($platform_list | index("debian")) then
                $os_versions[0].debian.versions[] as $osv |
                $php_list[] as $php |
                $architectures[] as $arch |
                select(is_excluded("debian"; $osv; $arch) | not) |
                {php_version: $php, platform: "debian", platform_version: $osv, arch: $arch}
              else empty end
            ]}
          ')

          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Generated $(echo "$MATRIX" | jq '.include | length') matrix entries"

  build:
    name: Build ${{ inputs.extension }} ${{ needs.prepare.outputs.extension_version }} on PHP ${{ matrix.php_version }} ${{ matrix.platform }} ${{ matrix.platform_version }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Read extension config
        id: config
        run: |
          EXT="${{ inputs.extension }}"
          PECL_NAME=$(jq -r ".extensions.${EXT}.pecl_name" extensions.json)
          BUILD_DEPS=$(jq -r ".extensions.${EXT}.dependencies.${{ matrix.platform }}.build // [] | join(\" \")" extensions.json)
          RUNTIME_DEPS=$(jq -r ".extensions.${EXT}.dependencies.${{ matrix.platform }}.runtime // [] | join(\" \")" extensions.json)

          echo "pecl_name=${PECL_NAME}" >> $GITHUB_OUTPUT
          echo "build_deps=${BUILD_DEPS}" >> $GITHUB_OUTPUT
          echo "runtime_deps=${RUNTIME_DEPS}" >> $GITHUB_OUTPUT

      - name: Build extension
        id: build
        run: |
          chmod +x scripts/build.sh

          # Determine channel based on version format
          VERSION="${{ needs.prepare.outputs.extension_version }}"
          if [[ "$VERSION" == dev-* ]]; then
            CHANNEL="dev"
          else
            CHANNEL="release"
          fi

          ./scripts/build.sh \
            "${{ inputs.extension }}" \
            "${{ needs.prepare.outputs.extension_version }}" \
            "${{ matrix.php_version }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.platform_version }}" \
            "${{ matrix.arch }}" \
            "${CHANNEL}"

          # Check if artifact was generated
          ARTIFACT_DIR="output/${{ inputs.extension }}/${{ matrix.php_version }}/${{ matrix.platform }}/${{ matrix.platform_version }}/${{ matrix.arch }}"
          if [ -d "$ARTIFACT_DIR" ] && ls "$ARTIFACT_DIR"/*.so 1>/dev/null 2>&1; then
            echo "artifact_exists=true" >> $GITHUB_OUTPUT
          else
            echo "artifact_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create artifact archive
        if: steps.build.outputs.artifact_exists == 'true'
        run: |
          EXT="${{ inputs.extension }}"
          EXT_VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ needs.prepare.outputs.extension_version }}")
          ARTIFACT_NAME="${EXT}-${EXT_VERSION}-php${{ matrix.php_version }}-${{ matrix.platform }}-${{ matrix.platform_version }}-${{ matrix.arch }}"
          cd output/${{ inputs.extension }}/${{ matrix.php_version }}/${{ matrix.platform }}/${{ matrix.platform_version }}/${{ matrix.arch }}
          tar -czvf "${ARTIFACT_NAME}.tar.gz" *.so metadata.json libs/ 2>/dev/null || tar -czvf "${ARTIFACT_NAME}.tar.gz" *.so metadata.json
          mv "${ARTIFACT_NAME}.tar.gz" "${{ github.workspace }}/"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        if: steps.build.outputs.artifact_exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          retention-days: 90

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: report-${{ inputs.extension }}-${{ matrix.php_version }}-${{ matrix.platform }}-${{ matrix.platform_version }}-${{ matrix.arch }}
          path: reports/
          retention-days: 90

  collect-artifacts:
    needs: [prepare, build]
    if: always()
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: dataset-branch-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts/

      - name: Prepare release artifacts
        id: prepare
        run: |
          EXT="${{ inputs.extension }}"
          VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ needs.prepare.outputs.extension_version }}")
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT

          mkdir -p release
          find artifacts/ -name "*.tar.gz" -exec cp {} release/ \; 2>/dev/null || true
          if [ -d release ] && [ "$(ls -A release 2>/dev/null)" ]; then
            echo "Collected artifacts:"
            ls -la release/
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "No artifacts collected"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload combined artifacts
        if: steps.prepare.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.extension }}-${{ steps.prepare.outputs.clean_version }}-all-builds
          path: release/
          retention-days: 90

      - name: Aggregate build reports
        id: aggregate
        run: |
          EXTENSION="${{ inputs.extension }}"
          VERSION="${{ steps.prepare.outputs.clean_version }}"
          RUN_ID="${{ github.run_id }}"

          # Date components
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")
          DAY=$(date -u +"%d")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Find all report JSON files (they are in artifacts/report-* directories)
          REPORTS=$(find artifacts/ -name "*.json" -path "*/report-*/*" 2>/dev/null || true)

          if [ -z "$REPORTS" ]; then
            echo "No reports found"
            echo "has_reports=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found reports:"
          echo "$REPORTS"

          # Create history directory structure
          HISTORY_DIR="dataset/history/${YEAR}/${MONTH}/${DAY}"
          HISTORY_FILE="${EXTENSION}-${VERSION}-${RUN_ID}.json"
          HISTORY_PATH="history/${YEAR}/${MONTH}/${DAY}/${HISTORY_FILE}"
          mkdir -p "$HISTORY_DIR"

          # Merge all reports into history file
          jq -s '.' $REPORTS > "${HISTORY_DIR}/${HISTORY_FILE}"

          # Calculate pass/fail/total from status field
          PASS=$(jq '[.[] | select(.status == "success")] | length' "${HISTORY_DIR}/${HISTORY_FILE}")
          FAIL=$(jq '[.[] | select(.status == "failure")] | length' "${HISTORY_DIR}/${HISTORY_FILE}")
          TOTAL=$(jq 'length' "${HISTORY_DIR}/${HISTORY_FILE}")

          # Create reports directory structure
          REPORTS_DIR="dataset/reports/${EXTENSION}"
          mkdir -p "$REPORTS_DIR"

          # Generate builds nested structure for reports/{extension}/{version}.json
          # This will be merged with existing data in the push step
          jq -n --arg timestamp "$TIMESTAMP" --arg history_path "$HISTORY_PATH" '
            {
              "last_updated": $timestamp,
              "builds": (
                [inputs] | add | group_by(.php_version) | map({
                  (.[0].php_version): (
                    group_by(.platform) | map({
                      (.[0].platform): (
                        group_by(.platform_version) | map({
                          (.[0].platform_version): (
                            map({(.arch): $history_path}) | add
                          )
                        }) | add
                      )
                    }) | add
                  )
                }) | add
              )
            }
          ' $REPORTS > "${REPORTS_DIR}/${VERSION}.json.new"

          # Create latest.json entry for this extension
          mkdir -p dataset
          jq -n \
            --arg ext "$EXTENSION" \
            --arg path "$HISTORY_PATH" \
            --arg version "$VERSION" \
            --arg updated_at "$TIMESTAMP" \
            --argjson pass "$PASS" \
            --argjson fail "$FAIL" \
            --argjson total "$TOTAL" \
            '{
              ($ext): {
                "path": $path,
                "version": $version,
                "updated_at": $updated_at,
                "pass": $pass,
                "fail": $fail,
                "total": $total
              }
            }' > dataset/latest.json.new

          echo "has_reports=true" >> $GITHUB_OUTPUT
          echo "history_path=${HISTORY_PATH}" >> $GITHUB_OUTPUT
          echo "reports_file=reports/${EXTENSION}/${VERSION}.json" >> $GITHUB_OUTPUT

          echo "Aggregated ${TOTAL} reports (pass: ${PASS}, fail: ${FAIL})"
          echo "History: ${HISTORY_PATH}"

      - name: Push to dataset branch
        if: steps.aggregate.outputs.has_reports == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTENSION="${{ inputs.extension }}"
          VERSION="${{ steps.prepare.outputs.clean_version }}"
          HISTORY_PATH="${{ steps.aggregate.outputs.history_path }}"
          REPORTS_FILE="${{ steps.aggregate.outputs.reports_file }}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch or create dataset branch
          if git fetch origin dataset:dataset 2>/dev/null; then
            echo "Fetched existing dataset branch"
          else
            echo "Creating new dataset branch"
            git checkout --orphan dataset
            git reset --hard
            git commit --allow-empty -m "Initialize dataset branch"
            git push origin dataset
            git checkout -
            git fetch origin dataset:dataset
          fi

          # Create worktree for dataset branch
          git worktree add dataset-worktree dataset

          # Copy history file (always new, no merge needed)
          HISTORY_DIR=$(dirname "dataset-worktree/${HISTORY_PATH}")
          mkdir -p "$HISTORY_DIR"
          cp "dataset/${HISTORY_PATH}" "dataset-worktree/${HISTORY_PATH}"

          # Merge latest.json with existing data
          if [ -f "dataset-worktree/latest.json" ]; then
            jq -s '.[0] * .[1]' "dataset-worktree/latest.json" "dataset/latest.json.new" > "dataset-worktree/latest.json.tmp"
            mv "dataset-worktree/latest.json.tmp" "dataset-worktree/latest.json"
          else
            cp "dataset/latest.json.new" "dataset-worktree/latest.json"
          fi

          # Merge reports/{extension}/{version}.json with existing data
          REPORTS_DIR=$(dirname "dataset-worktree/${REPORTS_FILE}")
          mkdir -p "$REPORTS_DIR"
          if [ -f "dataset-worktree/${REPORTS_FILE}" ]; then
            # Deep merge builds structure, update last_updated
            jq -s '
              .[0] as $existing |
              .[1] as $new |
              {
                "last_updated": $new.last_updated,
                "builds": ($existing.builds // {}) * $new.builds
              }
            ' "dataset-worktree/${REPORTS_FILE}" "dataset/reports/${EXTENSION}/${VERSION}.json.new" > "dataset-worktree/${REPORTS_FILE}.tmp"
            mv "dataset-worktree/${REPORTS_FILE}.tmp" "dataset-worktree/${REPORTS_FILE}"
          else
            cp "dataset/reports/${EXTENSION}/${VERSION}.json.new" "dataset-worktree/${REPORTS_FILE}"
          fi

          # Commit and push
          cd dataset-worktree
          git add -A
          git commit -m "Update build reports - ${EXTENSION} v${VERSION}" || {
            echo "No changes to commit"
            cd ..
            git worktree remove dataset-worktree
            exit 0
          }
          git push origin dataset

          cd ..
          git worktree remove dataset-worktree
          echo "Successfully pushed reports to dataset branch"

      - name: Create GitHub Release
        if: steps.prepare.outputs.has_artifacts == 'true' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT="${{ inputs.extension }}"
          VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ needs.prepare.outputs.extension_version }}")
          RELEASE_TAG="${EXT}-${VERSION}"

          # Create release notes
          cat > release_notes.md << EOF
          # ${EXT} ${VERSION}

          Pre-compiled PHP extension binaries.

          ## Supported Configurations

          - **PHP Versions**: $(jq -r 'keys | join(", ")' php-versions.json)
          - **Architectures**: $(jq -r '.architectures | join(", ")' extensions.json)
          - **Alpine Linux**: $(jq -r '.alpine.versions | join(", ")' os-versions.json)
          - **Debian**: $(jq -r '.debian.versions | join(", ")' os-versions.json)

          ## Installation

          \`\`\`bash
          tar -xzf ${EXT}-${VERSION}-php<version>-<platform>-<platform_version>-<arch>.tar.gz
          cp ${EXT}.so \$(php -r "echo ini_get('extension_dir');")
          echo "extension=${EXT}.so" >> \$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | tr -d ' ')
          \`\`\`

          Check \`metadata.json\` inside each archive for runtime dependencies.

          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

          # Delete existing release if it exists (to allow re-running the workflow)
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true

          # Create release with artifacts
          gh release create "$RELEASE_TAG" \
            --title "${EXT} ${VERSION}" \
            --notes-file release_notes.md \
            release/*.tar.gz
