name: Release
run-name: "Release ${{ inputs.extension }} ${{ inputs.extension_version }}"

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension name'
        required: true
        type: string
      extension_version:
        description: 'Extension version'
        required: true
        type: string
      rebuild:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: 'ubuntu-latest'

# Prevent concurrent releases of the same extension version
concurrency:
  group: release-${{ inputs.extension }}-${{ inputs.extension_version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-release:
    name: Check if ${{ inputs.extension }} ${{ inputs.extension_version }} needs building
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      clean_version: ${{ steps.check.outputs.clean_version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT="${{ inputs.extension }}"
          VERSION=$(./scripts/normalize-version.sh "$EXT" "${{ inputs.extension_version }}")
          RELEASE_TAG="${EXT}-${VERSION}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT

          if [[ "${{ inputs.rebuild }}" == "true" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG already exists"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release $RELEASE_TAG does not exist, will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ inputs.extension }} ${{ inputs.extension_version }}
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      extension: ${{ inputs.extension }}
      extension_version: ${{ inputs.extension_version }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  release:
    name: Create GitHub release for ${{ inputs.extension }} ${{ inputs.extension_version }}
    needs: [check-release, build]
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.extension }}-${{ needs.check-release.outputs.clean_version }}-all-builds
          path: release/

      - name: Generate release notes
        id: notes
        run: |
          cat > release_notes.md << EOF
          # ${{ inputs.extension }} v${{ needs.check-release.outputs.clean_version }}

          ## Supported Configurations

          ### PHP Versions
          $(jq -r 'keys | map("- PHP " + .) | join("\n")' php-versions.json)

          ### Platforms

          **Alpine Linux:**
          $(jq -r '.alpine | map("- Alpine " + .) | join("\n")' os-versions.json)

          **Debian:**
          $(jq -r '.debian | map("- " + .) | join("\n")' os-versions.json)

          ## Installation

          Download the appropriate \`.tar.gz\` file for your PHP version and platform, then:

          \`\`\`bash
          tar -xzf ${{ inputs.extension }}-<php_version>-<platform>-<platform_version>.tar.gz
          cp ${{ inputs.extension }}.so \$(php -r "echo ini_get('extension_dir');")
          echo "extension=${{ inputs.extension }}.so" >> \$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | tr -d ' ')
          \`\`\`

          ## Runtime Dependencies

          Check the \`metadata.json\` inside each archive for platform-specific runtime dependencies.

          ---
          Built on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ needs.check-release.outputs.release_tag }}"

          # Delete existing release if rebuilding
          if [[ "${{ inputs.rebuild }}" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes || true
            git push origin --delete "$RELEASE_TAG" || true
          fi

          # Create release with all artifacts
          gh release create "$RELEASE_TAG" \
            --title "${{ inputs.extension }} v${{ needs.check-release.outputs.clean_version }}" \
            --notes-file release_notes.md \
            release/*.tar.gz

  update-version-cache:
    name: Update version cache for ${{ inputs.extension }}
    needs: release
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Update version cache via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTENSION="${{ inputs.extension }}"
          VERSION="${{ inputs.extension_version }}"
          FILE_PATH=".versions/${EXTENSION}.txt"
          CONTENT=$(echo -n "$VERSION" | base64)

          # Get current file SHA if it exists
          SHA=$(gh api "repos/${{ github.repository }}/contents/${FILE_PATH}" --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$SHA" ]; then
            # Update existing file
            gh api -X PUT "repos/${{ github.repository }}/contents/${FILE_PATH}" \
              -f message="Update ${EXTENSION} version cache to ${VERSION}" \
              -f content="${CONTENT}" \
              -f sha="${SHA}"
          else
            # Create new file (also creates .versions directory if needed)
            gh api -X PUT "repos/${{ github.repository }}/contents/${FILE_PATH}" \
              -f message="Add ${EXTENSION} version cache (${VERSION})" \
              -f content="${CONTENT}"
          fi

          echo "Updated version cache for ${EXTENSION} to ${VERSION}"
