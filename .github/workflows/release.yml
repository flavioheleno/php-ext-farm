name: Release
run-name: "Release ${{ inputs.extension }} ${{ inputs.extension_version || 'latest' }}"

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension name'
        required: true
        type: string
      extension_version:
        description: 'Extension version (leave empty for latest)'
        required: false
        type: string
        default: ''
      rebuild:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      extension:
        description: 'Extension name'
        required: true
        type: string
      extension_version:
        description: 'Extension version (leave empty for latest)'
        required: false
        type: string
        default: ''
      rebuild:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'

# Prevent concurrent releases of the same extension version
concurrency:
  group: release-${{ inputs.extension }}-${{ inputs.extension_version || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-release:
    name: Check if ${{ inputs.extension }} needs building
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      clean_version: ${{ steps.check.outputs.clean_version }}
      extension_version: ${{ steps.check.outputs.extension_version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTENSION="${{ inputs.extension }}"

          # Resolve version - use input or fall back to latest from extensions.json
          INPUT_VERSION="${{ inputs.extension_version }}"
          if [[ -z "$INPUT_VERSION" ]]; then
            INPUT_VERSION=$(jq -r ".extensions.\"${EXTENSION}\".latest_version // empty" extensions.json)
            if [[ -z "$INPUT_VERSION" ]]; then
              # Check if last_checked exists (extension tracked but no releases yet)
              LAST_CHECKED=$(jq -r ".extensions.\"${EXTENSION}\".last_checked // empty" extensions.json)
              if [[ -n "$LAST_CHECKED" ]]; then
                INPUT_VERSION="dev"
                echo "No releases found for '${EXTENSION}', using development version"
              else
                echo "Error: No version provided and no latest_version found for extension '${EXTENSION}'"
                exit 1
              fi
            fi
            echo "Using latest_version from extensions.json: $INPUT_VERSION"
          fi
          echo "extension_version=${INPUT_VERSION}" >> $GITHUB_OUTPUT

          VERSION=$(./scripts/normalize-version.sh "$EXTENSION" "$INPUT_VERSION")
          RELEASE_TAG="${EXTENSION}-${VERSION}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT

          if [[ "${{ inputs.rebuild }}" == "true" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG already exists"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release $RELEASE_TAG does not exist, will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ inputs.extension }} ${{ needs.check-release.outputs.extension_version }}
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      extension: ${{ inputs.extension }}
      extension_version: ${{ needs.check-release.outputs.extension_version }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  release:
    name: Create GitHub release for ${{ inputs.extension }} ${{ needs.check-release.outputs.extension_version }}
    needs: [check-release, build]
    if: always() && needs.check-release.outputs.should_build == 'true' && !cancelled() && needs.build.result != 'cancelled'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.extension }}-${{ needs.check-release.outputs.clean_version }}-all-builds
          path: release/

      - name: Generate release notes
        id: notes
        run: |
          cat > release_notes.md << EOF
          # ${{ inputs.extension }} v${{ needs.check-release.outputs.clean_version }}

          ## Supported Configurations

          ### PHP Versions
          $(jq -r 'keys | map("- PHP " + .) | join("\n")' php-versions.json)

          ### Platforms

          **Alpine Linux:**
          $(jq -r '.alpine.versions | map("- Alpine " + .) | join("\n")' os-versions.json)

          **Debian:**
          $(jq -r '.debian.versions | map("- " + .) | join("\n")' os-versions.json)

          ## Installation

          Download the appropriate \`.tar.gz\` file for your PHP version and platform, then:

          \`\`\`bash
          tar -xzf ${{ inputs.extension }}-<php_version>-<platform>-<platform_version>.tar.gz
          cp ${{ inputs.extension }}.so \$(php -r "echo ini_get('extension_dir');")
          echo "extension=${{ inputs.extension }}.so" >> \$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | tr -d ' ')
          \`\`\`

          ## Runtime Dependencies

          Check the \`metadata.json\` inside each archive for platform-specific runtime dependencies.

          ---
          Built on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ needs.check-release.outputs.release_tag }}"

          # Delete existing release if rebuilding
          if [[ "${{ inputs.rebuild }}" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes || true
            git push origin --delete "$RELEASE_TAG" || true
          fi

          # Create release with all artifacts
          gh release create "$RELEASE_TAG" \
            --title "${{ inputs.extension }} v${{ needs.check-release.outputs.clean_version }}" \
            --notes-file release_notes.md \
            release/*.tar.gz


