name: Release

on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension name'
        required: true
        type: string
      extension_version:
        description: 'Extension version'
        required: true
        type: string
      rebuild:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT="${{ inputs.extension }}"
          VERSION="${{ inputs.extension_version }}"
          # Strip extension name prefix from version if present (e.g., "yar-2.3.3" -> "2.3.3")
          VERSION="${VERSION#${EXT}-}"
          # Also strip common prefixes like "v" or "release-"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#release-}"
          VERSION="${VERSION#release_}"
          VERSION="${VERSION//_/.}"
          RELEASE_TAG="${EXT}-${VERSION}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT
          
          if [[ "${{ inputs.rebuild }}" == "true" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release $RELEASE_TAG already exists"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release $RELEASE_TAG does not exist, will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      extension: ${{ inputs.extension }}
      extension_version: ${{ inputs.extension_version }}

  release:
    needs: [check-release, build]
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.extension }}-${{ needs.check-release.outputs.clean_version }}-all-builds
          path: release/

      - name: Generate release notes
        id: notes
        run: |
          cat > release_notes.md << EOF
          # ${{ inputs.extension }} v${{ needs.check-release.outputs.clean_version }}
          
          ## Supported Configurations
          
          ### PHP Versions
          $(jq -r '.php_versions | map("- PHP " + .) | join("\n")' extensions.json)
          
          ### Platforms
          
          **Alpine Linux:**
          $(jq -r '.platforms.alpine.versions | map("- Alpine " + .) | join("\n")' extensions.json)
          
          **Debian:**
          $(jq -r '.platforms.debian.versions | map("- " + .) | join("\n")' extensions.json)
          
          ## Installation
          
          Download the appropriate \`.tar.gz\` file for your PHP version and platform, then:
          
          \`\`\`bash
          tar -xzf ${{ inputs.extension }}-<php_version>-<platform>-<platform_version>.tar.gz
          cp ${{ inputs.extension }}.so \$(php -r "echo ini_get('extension_dir');")
          echo "extension=${{ inputs.extension }}.so" >> \$(php --ini | grep "Loaded Configuration" | cut -d: -f2 | tr -d ' ')
          \`\`\`
          
          ## Runtime Dependencies
          
          Check the \`metadata.json\` inside each archive for platform-specific runtime dependencies.
          
          ---
          Built on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ needs.check-release.outputs.release_tag }}"
          
          # Delete existing release if rebuilding
          if [[ "${{ inputs.rebuild }}" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes || true
            git push origin --delete "$RELEASE_TAG" || true
          fi
          
          # Create release with all artifacts
          gh release create "$RELEASE_TAG" \
            --title "${{ inputs.extension }} v${{ needs.check-release.outputs.clean_version }}" \
            --notes-file release_notes.md \
            release/*.tar.gz

  update-version-cache:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Update version cache
        run: |
          mkdir -p .versions
          echo "${{ inputs.extension_version }}" > ".versions/${{ inputs.extension }}.txt"

      - name: Commit version cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .versions/
          git diff --staged --quiet || git commit -m "Update ${{ inputs.extension }} version cache to ${{ inputs.extension_version }}"
          git push
