name: Build OS Base Images

on:
  schedule:
    # Run weekly on Saturdays at 2 AM UTC (before PHP builds)
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (alpine, debian, or "all")'
        required: false
        default: 'all'
        type: string
      architectures:
        description: 'Architectures (comma-separated, e.g., amd64,arm64, or "all")'
        required: false
        default: 'all'
        type: string
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-slim
          - self-hosted
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      platform:
        description: 'Platform to build (alpine, debian, or "all")'
        required: false
        type: string
        default: 'all'
      architectures:
        description: 'Architectures (comma-separated, e.g., amd64,arm64, or "all")'
        required: false
        type: string
        default: 'all'
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
  push:
    paths:
      - 'docker/base/os/**'
      - 'os-versions.json'

# Prevent concurrent OS base image builds
concurrency:
  group: build-os-base-images-${{ inputs.platform || 'all' }}-${{ inputs.architectures || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OS_IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare OS build matrix
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      manifest_matrix: ${{ steps.matrix.outputs.manifest_matrix }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate OS build matrix
        id: matrix
        run: |
          MATRIX=$(jq -c -n --arg platform "${{ inputs.platform || 'all' }}" \
                           --arg archs "${{ inputs.architectures || 'all' }}" \
                           --slurpfile os_versions os-versions.json \
                           --slurpfile extensions extensions.json '
            (if $platform == "all" then ["alpine", "debian"] else [$platform] end) as $platform_list |
            (if $archs == "all" then $extensions[0].architectures else ($archs | split(",")) end) as $architectures |
            
            {include: [
              if ($platform_list | index("alpine")) then
                $os_versions[0].alpine.versions[] as $osv |
                $architectures[] as $arch |
                # Check if this combination is excluded
                if (($os_versions[0].alpine.exclude // []) | any(.version == $osv and .arch == $arch)) then
                  empty
                else
                  {platform: "alpine", platform_version: $osv, arch: $arch}
                end
              else empty end,
              
              if ($platform_list | index("debian")) then
                $os_versions[0].debian.versions[] as $osv |
                $architectures[] as $arch |
                # Check if this combination is excluded
                if (($os_versions[0].debian.exclude // []) | any(.version == $osv and .arch == $arch)) then
                  empty
                else
                  {platform: "debian", platform_version: $osv, arch: $arch}
                end
              else empty end
            ]}
          ')
          
          # Create manifest matrix (one entry per platform/version, no arch)
          MANIFEST_MATRIX=$(jq -c -n --arg platform "${{ inputs.platform || 'all' }}" \
                           --slurpfile os_versions os-versions.json '
            (if $platform == "all" then ["alpine", "debian"] else [$platform] end) as $platform_list |
            
            {include: [
              if ($platform_list | index("alpine")) then
                $os_versions[0].alpine.versions[] as $osv |
                {platform: "alpine", platform_version: $osv}
              else empty end,
              
              if ($platform_list | index("debian")) then
                $os_versions[0].debian.versions[] as $osv |
                {platform: "debian", platform_version: $osv}
              else empty end
            ]}
          ')
          
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "manifest_matrix=${MANIFEST_MATRIX}" >> $GITHUB_OUTPUT
          echo "Generated $(echo "$MATRIX" | jq '.include | length') OS build jobs"
          echo "Generated $(echo "$MANIFEST_MATRIX" | jq '.include | length') manifest jobs"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.platform_version }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          echo "tag=${{ matrix.platform_version }}" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check
        if: ${{ inputs.force_rebuild != true }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OS_IMAGE_NAME }}/${{ matrix.platform }}:${{ steps.tag.outputs.tag }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image $IMAGE already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image $IMAGE does not exist, will build"
          fi

      - name: Map architecture to Docker platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            amd64)   PLATFORM="linux/amd64" ;;
            arm64)   PLATFORM="linux/arm64" ;;
            arm32v7) PLATFORM="linux/arm/v7" ;;
            arm32v6) PLATFORM="linux/arm/v6" ;;
            *)       echo "Unknown arch: ${{ matrix.arch }}"; exit 1 ;;
          esac
          echo "platform=${PLATFORM}" >> $GITHUB_OUTPUT

      - name: Build and push OS image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/base/os/Dockerfile.${{ matrix.platform }}
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.OS_IMAGE_NAME }}/${{ matrix.platform }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            ${{ matrix.platform == 'alpine' && format('ALPINE_VERSION={0}', matrix.platform_version) || format('DEBIAN_VERSION={0}', matrix.platform_version) }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: Create manifest for ${{ matrix.platform }} ${{ matrix.platform_version }}
    needs: [prepare, build]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.manifest_matrix) }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push OS manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OS_IMAGE_NAME }}/${{ matrix.platform }}:${{ matrix.platform_version }}"
          
          IMAGES=""
          for arch in amd64 arm64 arm32v7 arm32v6; do
            ARCH_IMAGE="${IMAGE}-${arch}"
            if docker manifest inspect "$ARCH_IMAGE" > /dev/null 2>&1; then
              IMAGES="$IMAGES $ARCH_IMAGE"
            fi
          done
          
          if [ -n "$IMAGES" ]; then
            echo "Creating OS manifest for: $IMAGES"
            docker manifest create "$IMAGE" $IMAGES --amend || true
            docker manifest push "$IMAGE" || true
          else
            echo "No arch-specific images found for $IMAGE"
          fi
