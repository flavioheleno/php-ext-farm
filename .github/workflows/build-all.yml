name: Build All Extensions

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all extensions'
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: 'ubuntu-latest'
      build_dev:
        description: 'Also build dev channel (HEAD of default branch)'
        type: boolean
        default: true

# Only one full rebuild should run at a time
concurrency:
  group: build-all
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    name: Prepare extension list
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
      dev_builds: ${{ steps.dev.outputs.dev_builds }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get extension list
        id: list
        run: |
          EXTENSIONS=$(jq -c '[.extensions | keys[]]' extensions.json)
          echo "extensions=${EXTENSIONS}" >> $GITHUB_OUTPUT
          echo "Extensions to build: ${EXTENSIONS}"

      - name: Get dev versions for all extensions
        id: dev
        if: inputs.build_dev != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_BUILDS="[]"

          for ext in $(jq -r '.extensions | keys[]' extensions.json); do
            TRACK_URL=$(jq -r ".extensions.${ext}.track_url" extensions.json)
            REPO_PATH=$(echo "$TRACK_URL" | sed 's|https://github.com/||' | sed 's|https://bitbucket.org/||')

            # Get default branch name and HEAD commit
            DEFAULT_BRANCH=$(gh api "repos/${REPO_PATH}" --jq '.default_branch' 2>/dev/null || echo "main")
            HEAD_SHA=$(gh api "repos/${REPO_PATH}/commits/${DEFAULT_BRANCH}" --jq '.sha' 2>/dev/null || echo "")

            if [[ -z "$HEAD_SHA" ]]; then
              echo "Could not get HEAD SHA for ${ext}, skipping dev build"
              continue
            fi

            # Use short SHA as version (first 7 characters)
            SHORT_SHA="${HEAD_SHA:0:7}"
            DEV_VERSION="dev-${SHORT_SHA}"

            DEV_BUILDS=$(echo "$DEV_BUILDS" | jq -c --arg ext "$ext" --arg ver "$DEV_VERSION" '. + [{"extension": $ext, "version": $ver}]')
            echo "Dev version for ${ext}: ${DEV_VERSION} (branch: ${DEFAULT_BRANCH})"
          done

          echo "dev_builds=${DEV_BUILDS}" >> $GITHUB_OUTPUT
          echo "Prepared $(echo "$DEV_BUILDS" | jq 'length') dev builds"

  build-release:
    name: Release ${{ matrix.extension }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.prepare.outputs.extensions) }}
    uses: ./.github/workflows/release.yml
    with:
      extension: ${{ matrix.extension }}
      rebuild: ${{ inputs.force_rebuild || false }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
    secrets: inherit

  build-dev:
    name: Dev build ${{ matrix.extension }}
    needs: prepare
    if: inputs.build_dev != false && needs.prepare.outputs.dev_builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.dev_builds) }}
    uses: ./.github/workflows/build.yml
    with:
      extension: ${{ matrix.extension }}
      extension_version: ${{ matrix.version }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
    secrets: inherit
