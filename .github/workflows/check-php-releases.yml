name: Check PHP Releases

on:
  schedule:
    # Run daily at 4 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-slim
          - self-hosted
        default: 'ubuntu-latest'

# Only one PHP release check should run at a time
concurrency:
  group: check-php-releases
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check-php-releases:
    name: Check for new PHP releases
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check for new PHP releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPDATES="[]"
          
          # Fetch active PHP releases from php.net
          echo "Fetching active PHP releases from php.net..."
          ACTIVE_RELEASES=$(curl -fsSL https://www.php.net/releases/active.php)
          
          for php_version in $(jq -r 'keys[]' php-versions.json); do
            BRANCH=$(jq -r --arg v "$php_version" '.[$v].branch // ""' php-versions.json)
            CURRENT_TAG=$(jq -r --arg v "$php_version" '.[$v].tag // ""' php-versions.json)
            
            # Skip 'next' version - it always tracks master HEAD
            if [[ "$php_version" == "next" ]]; then
              echo "Skipping next (tracks master HEAD)"
              continue
            fi
            
            # Skip if no branch defined
            if [[ -z "$BRANCH" ]]; then
              echo "No branch defined for PHP $php_version, skipping"
              continue
            fi
            
            # Get latest version and SHA256 from active.php
            VERSION_DATA=$(echo "$ACTIVE_RELEASES" | jq -r --arg v "$php_version" '."8"[$v] // empty')
            
            if [[ -z "$VERSION_DATA" ]]; then
              echo "Could not find PHP $php_version in active releases"
              continue
            fi
            
            LATEST_VERSION=$(echo "$VERSION_DATA" | jq -r '.version // ""')
            LATEST_TAG="php-${LATEST_VERSION}"
            
            # Get SHA256 for tar.xz (we use this format)
            SHA256=$(echo "$VERSION_DATA" | jq -r '.source[] | select(.filename | endswith(".tar.xz")) | .sha256 // ""')
            
            if [[ -z "$LATEST_VERSION" || -z "$SHA256" ]]; then
              echo "Could not get version or SHA256 for PHP $php_version"
              continue
            fi
            
            echo "PHP $php_version: current=$CURRENT_TAG, latest=$LATEST_TAG, sha256=$SHA256"
            
            if [[ -n "$LATEST_TAG" && "$LATEST_TAG" != "$CURRENT_TAG" ]]; then
              echo "Update found: $php_version ($CURRENT_TAG -> $LATEST_TAG)"
              UPDATES=$(echo "$UPDATES" | jq --arg v "$php_version" --arg t "$LATEST_TAG" --arg s "$SHA256" \
                '. + [{"version": $v, "tag": $t, "sha256": $s}]')
            fi
          done
          
          echo "updates=$(echo "$UPDATES" | jq -c)" >> $GITHUB_OUTPUT
          echo "Found $(echo "$UPDATES" | jq 'length') updates"

      - name: Update php-versions.json
        if: steps.check.outputs.updates != '[]'
        run: |
          echo '${{ steps.check.outputs.updates }}' | jq -c '.[]' | while read -r update; do
            VERSION=$(echo "$update" | jq -r '.version')
            TAG=$(echo "$update" | jq -r '.tag')
            SHA256=$(echo "$update" | jq -r '.sha256')
            
            echo "Updating PHP $VERSION to $TAG (sha256: ${SHA256:0:16}...)"
            
            # Update the tag and sha256 in php-versions.json
            jq --arg v "$VERSION" --arg t "$TAG" --arg s "$SHA256" \
              '.[$v].tag = $t | .[$v].sha256 = $s' \
              php-versions.json > php-versions.json.tmp
            mv php-versions.json.tmp php-versions.json
          done
          
          cat php-versions.json

      - name: Commit and push changes
        if: steps.check.outputs.updates != '[]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add php-versions.json
          git diff --staged --quiet || git commit -m "Update PHP versions

          $(echo '${{ steps.check.outputs.updates }}' | jq -r '.[] | "- PHP \(.version): \(.tag)"')"
          git push

      - name: Trigger base image builds
        if: steps.check.outputs.updates != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.check.outputs.updates }}' | jq -c '.[]' | while read -r update; do
            VERSION=$(echo "$update" | jq -r '.version')
            
            echo "Triggering base image build for PHP $VERSION"
            gh workflow run build-base-images.yml -f php_version="$VERSION"
          done
