name: Build PHP Base Images

on:
  schedule:
    # Run weekly on Saturdays at 3 AM UTC (after OS builds)
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (e.g., 8.3, or "all")'
        required: false
        default: 'all'
        type: string
      platform:
        description: 'Platform to build (alpine, debian, or "all")'
        required: false
        default: 'all'
        type: string
      architectures:
        description: 'Architectures (comma-separated, e.g., amd64,arm64, or "all")'
        required: false
        default: 'all'
        type: string
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - self-hosted
        default: 'ubuntu-24.04'
  workflow_call:
    inputs:
      php_version:
        description: 'PHP version to build (e.g., 8.3, or "all")'
        required: false
        type: string
        default: 'all'
      platform:
        description: 'Platform to build (alpine, debian, or "all")'
        required: false
        type: string
        default: 'all'
      architectures:
        description: 'Architectures (comma-separated, e.g., amd64,arm64, or "all")'
        required: false
        type: string
        default: 'all'
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to use'
        required: false
        type: string
        default: 'ubuntu-24.04'
  push:
    paths:
      - 'docker/base/php/**'
      - 'php-versions.json'

# Prevent concurrent PHP base image builds
concurrency:
  group: build-php-base-images-${{ inputs.php_version || 'all' }}-${{ inputs.platform || 'all' }}-${{ inputs.architectures || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OS_IMAGE_NAME: ${{ github.repository }}
  PHP_IMAGE_NAME: ${{ github.repository }}/php

jobs:
  prepare:
    name: Prepare PHP build matrix
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      manifest_matrix: ${{ steps.matrix.outputs.manifest_matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate PHP build matrix
        id: matrix
        run: |
          MATRIX=$(jq -c -n --arg php_ver "${{ inputs.php_version || 'all' }}" \
                           --arg platform "${{ inputs.platform || 'all' }}" \
                           --arg archs "${{ inputs.architectures || 'all' }}" \
                           --slurpfile php_versions php-versions.json \
                           --slurpfile os_versions os-versions.json \
                           --slurpfile extensions extensions.json '
            (if $php_ver == "all" then ($php_versions[0] | keys) else [$php_ver] end) as $php_list |
            (if $platform == "all" then ["alpine", "debian"] else [$platform] end) as $platform_list |
            (if $archs == "all" then $extensions[0].architectures else ($archs | split(",")) end) as $architectures |

            {include: [
              if ($platform_list | index("alpine")) then
                $os_versions[0].alpine.versions[] as $osv |
                $php_list[] as $php |
                $architectures[] as $arch |
                # Check if this combination is excluded
                if (($os_versions[0].alpine.exclude // []) | any(.version == $osv and .arch == $arch)) then
                  empty
                else
                  ($php_versions[0][$php].tag // "") as $php_tag |
                  ($php_versions[0][$php].branch // "master") as $php_branch |
                  ($php_versions[0][$php].sha256 // "") as $php_sha256 |
                  {php_version: $php, php_tag: $php_tag, php_branch: $php_branch, php_sha256: $php_sha256, platform: "alpine", platform_version: $osv, arch: $arch}
                end
              else empty end,

              if ($platform_list | index("debian")) then
                $os_versions[0].debian.versions[] as $osv |
                $php_list[] as $php |
                $architectures[] as $arch |
                # Check if this combination is excluded
                if (($os_versions[0].debian.exclude // []) | any(.version == $osv and .arch == $arch)) then
                  empty
                else
                  ($php_versions[0][$php].tag // "") as $php_tag |
                  ($php_versions[0][$php].branch // "master") as $php_branch |
                  ($php_versions[0][$php].sha256 // "") as $php_sha256 |
                  {php_version: $php, php_tag: $php_tag, php_branch: $php_branch, php_sha256: $php_sha256, platform: "debian", platform_version: $osv, arch: $arch}
                end
              else empty end
            ]}
          ')

          # Create manifest matrix (one entry per php_version/platform/version, with valid architectures)
          MANIFEST_MATRIX=$(jq -c -n --arg php_ver "${{ inputs.php_version || 'all' }}" \
                           --arg platform "${{ inputs.platform || 'all' }}" \
                           --arg archs "${{ inputs.architectures || 'all' }}" \
                           --slurpfile php_versions php-versions.json \
                           --slurpfile os_versions os-versions.json \
                           --slurpfile extensions extensions.json '
            (if $php_ver == "all" then ($php_versions[0] | keys) else [$php_ver] end) as $php_list |
            (if $platform == "all" then ["alpine", "debian"] else [$platform] end) as $platform_list |
            (if $archs == "all" then $extensions[0].architectures else ($archs | split(",")) end) as $architectures |

            {include: [
              if ($platform_list | index("alpine")) then
                $os_versions[0].alpine.versions[] as $osv |
                $php_list[] as $php |
                ($architectures - [($os_versions[0].alpine.exclude // [])[] | select(.version == $osv) | .arch]) as $valid_archs |
                {php_version: $php, platform: "alpine", platform_version: $osv, architectures: ($valid_archs | join(","))}
              else empty end,

              if ($platform_list | index("debian")) then
                $os_versions[0].debian.versions[] as $osv |
                $php_list[] as $php |
                ($architectures - [($os_versions[0].debian.exclude // [])[] | select(.version == $osv) | .arch]) as $valid_archs |
                {php_version: $php, platform: "debian", platform_version: $osv, architectures: ($valid_archs | join(","))}
              else empty end
            ]}
          ')

          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "manifest_matrix=${MANIFEST_MATRIX}" >> $GITHUB_OUTPUT
          echo "Generated $(echo "$MATRIX" | jq '.include | length') PHP build jobs"
          echo "Generated $(echo "$MANIFEST_MATRIX" | jq '.include | length') manifest jobs"

  build:
    name: Build PHP ${{ matrix.php_version }} on ${{ matrix.platform }} ${{ matrix.platform_version }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ inputs.runner || (matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        if: matrix.arch == 'arm32v6' || matrix.arch == 'arm32v7'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          if [[ "${{ matrix.platform }}" == "alpine" ]]; then
            TAG="${{ matrix.php_version }}-alpine${{ matrix.platform_version }}"
          else
            TAG="${{ matrix.php_version }}-${{ matrix.platform_version }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Check if image exists
        id: check
        if: ${{ inputs.force_rebuild != true }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PHP_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image $IMAGE already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image $IMAGE does not exist, will build"
          fi

      - name: Map architecture to Docker platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            amd64)   PLATFORM="linux/amd64" ;;
            arm64)   PLATFORM="linux/arm64" ;;
            arm32v7) PLATFORM="linux/arm/v7" ;;
            arm32v6) PLATFORM="linux/arm/v6" ;;
            *)       echo "Unknown arch: ${{ matrix.arch }}"; exit 1 ;;
          esac
          echo "platform=${PLATFORM}" >> $GITHUB_OUTPUT

      - name: Build and push PHP image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/base/php/Dockerfile.${{ matrix.platform }}
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.PHP_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE_REGISTRY=${{ env.REGISTRY }}/${{ env.OS_IMAGE_NAME }}
            ${{ matrix.platform == 'alpine' && format('ALPINE_VERSION={0}', matrix.platform_version) || format('DEBIAN_VERSION={0}', matrix.platform_version) }}
            PHP_VERSION_TAG=${{ matrix.php_tag }}
            PHP_VERSION_BRANCH=${{ matrix.php_branch }}
            PHP_VERSION_SHA256=${{ matrix.php_sha256 }}
            PHP_VERSION=${{ matrix.php_version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: Create manifest for PHP ${{ matrix.php_version }} on ${{ matrix.platform }} ${{ matrix.platform_version }}
    needs: [prepare, build]
    if: always() && !cancelled() && needs.build.result != 'cancelled'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.manifest_matrix) }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          if [[ "${{ matrix.platform }}" == "alpine" ]]; then
            TAG="${{ matrix.php_version }}-alpine${{ matrix.platform_version }}"
          else
            TAG="${{ matrix.php_version }}-${{ matrix.platform_version }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create and push PHP manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PHP_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

          # Use architectures from matrix (respects exclude configuration)
          IFS=',' read -ra ARCHS <<< "${{ matrix.architectures }}"

          IMAGES=()
          MISSING=()
          for arch in "${ARCHS[@]}"; do
            ARCH_IMAGE="${IMAGE}-${arch}"
            if docker manifest inspect "$ARCH_IMAGE" > /dev/null 2>&1; then
              IMAGES+=("$ARCH_IMAGE")
            else
              MISSING+=("$ARCH_IMAGE")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "Missing arch-specific images; refusing to publish partial manifest:"
            printf ' - %s\n' "${MISSING[@]}"
            exit 1
          fi

          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "No arch-specific images found for $IMAGE"
            exit 1
          fi

          echo "Creating PHP manifest for: ${IMAGES[*]}"
          docker manifest create "$IMAGE" "${IMAGES[@]}" --amend
          docker manifest push "$IMAGE"
