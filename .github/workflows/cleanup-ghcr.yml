name: Cleanup GHCR

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [alpine, debian, php]
    steps:
      - name: Delete ghost and partial images for ${{ matrix.package }}
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}/${{ matrix.package }}
          delete-ghost-images: true
          delete-partial-images: true
          token: ${{ secrets.GITHUB_TOKEN }}
