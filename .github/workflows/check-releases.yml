name: Check Releases

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: 'ubuntu-latest'

# Only one release check should run at a time
concurrency:
  group: check-releases
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check-extension-releases:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check for new extension releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPDATES="[]"
          
          for ext in $(jq -r '.extensions | keys[]' extensions.json); do
            TRACK_URL=$(jq -r ".extensions.${ext}.track_url" extensions.json)
            
            # Skip non-GitHub URLs
            if [[ "$TRACK_URL" != *"github.com"* ]]; then
              echo "Skipping ${ext}: non-GitHub URL"
              continue
            fi
            
            REPO_PATH=$(echo "$TRACK_URL" | sed 's|https://github.com/||')
            
            # Get latest release or tag (with proper error handling)
            LATEST=""
            if RELEASE_DATA=$(gh api "repos/${REPO_PATH}/releases/latest" 2>/dev/null); then
              LATEST=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')
            fi
            
            if [[ -z "$LATEST" ]]; then
              if TAG_DATA=$(gh api "repos/${REPO_PATH}/tags?per_page=1" 2>/dev/null); then
                LATEST=$(echo "$TAG_DATA" | jq -r '.[0].name // empty')
              fi
            fi
            
            if [[ -z "$LATEST" ]]; then
              echo "Warning: Could not get version for ${ext}"
              continue
            fi
            
            # Get cached version
            CACHED_FILE=".versions/${ext}.txt"
            CACHED=""
            if [[ -f "$CACHED_FILE" ]]; then
              CACHED=$(cat "$CACHED_FILE")
            fi
            
            if [[ -n "$LATEST" && "$LATEST" != "$CACHED" ]]; then
              UPDATES=$(echo "$UPDATES" | jq --arg ext "$ext" --arg ver "$LATEST" '. + [{"extension": $ext, "version": $ver}]')
              echo "Update found: ${ext} ${CACHED:-<none>} -> ${LATEST}"
            fi
          done
          
          echo "updates=$(echo "$UPDATES" | jq -c)" >> $GITHUB_OUTPUT
          echo "Found $(echo "$UPDATES" | jq length) updates"

      - name: Trigger builds for updated extensions
        if: steps.check.outputs.updates != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.check.outputs.updates }}' | jq -c '.[]' | while read -r update; do
            EXT=$(echo "$update" | jq -r '.extension')
            VER=$(echo "$update" | jq -r '.version')
            
            gh workflow run build.yml \
              -f extension="$EXT" \
              -f extension_version="$VER"
          done

  check-php-releases:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check for new PHP releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for version in $(jq -r '.php_versions[]' extensions.json); do
            # Check PHP docker tags for new releases
            LATEST=$(curl -s "https://hub.docker.com/v2/repositories/library/php/tags?name=${version}&page_size=100" | \
                     jq -r ".results[] | select(.name | test(\"^${version}\\\\.[0-9]+-cli-alpine\")) | .name" | \
                     sort -V | tail -1)
            
            echo "PHP ${version}: Latest tag is ${LATEST:-unknown}"
          done

  check-base-image-updates:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check Alpine releases
        run: |
          for alpine_ver in $(jq -r '.platforms.alpine.versions[]' extensions.json); do
            echo "Checking Alpine ${alpine_ver}..."
            # Could trigger rebuilds if Alpine base images are updated
          done

      - name: Check Debian releases
        run: |
          for debian_ver in $(jq -r '.platforms.debian.versions[]' extensions.json); do
            echo "Checking Debian ${debian_ver}..."
            # Could trigger rebuilds if Debian base images are updated
          done
