name: Check Releases

on:
  schedule:
    # Run hourly on Mondays, checking up to 20 extensions per run until all are checked
    - cron: '0 0-23 * * 1'

  workflow_dispatch:

# Only one release check should run at a time
concurrency:
  group: check-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-extension-releases:
    name: Check for new extension releases
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write
    outputs:
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for new extension releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPDATES="[]"
          EXTENSIONS_CHECKED=0
          MAX_EXTENSIONS=20
          CURRENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Get start of current week (Monday 00:00:00 UTC)
          WEEK_START=$(date -u -d "last monday" +%Y-%m-%dT00:00:00Z 2>/dev/null || date -u -v-monday +%Y-%m-%dT00:00:00Z)

          for ext in $(jq -r '.extensions | keys[]' extensions.json); do
            # Skip if already checked this week
            LAST_CHECKED=$(jq -r ".extensions.${ext}.last_checked // empty" extensions.json)
            if [[ -n "$LAST_CHECKED" && "$LAST_CHECKED" > "$WEEK_START" ]]; then
              continue
            fi

            # Stop if we've checked enough extensions this run
            if [[ $EXTENSIONS_CHECKED -ge $MAX_EXTENSIONS ]]; then
              break
            fi

            TRACK_URL=$(jq -r ".extensions.${ext}.track_url" extensions.json)

            # Get latest version based on hosting platform
            LATEST=""
            if [[ "$TRACK_URL" == *"github.com"* ]]; then
              REPO_PATH=$(echo "$TRACK_URL" | sed 's|https://github.com/||')
              if RELEASE_DATA=$(gh api "repos/${REPO_PATH}/releases/latest" 2>/dev/null); then
                LATEST=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')
              fi
              if [[ -z "$LATEST" ]]; then
                if TAG_DATA=$(gh api "repos/${REPO_PATH}/tags?per_page=1" 2>/dev/null); then
                  LATEST=$(echo "$TAG_DATA" | jq -r '.[0].name // empty')
                fi
              fi
            elif [[ "$TRACK_URL" == *"gitlab.com"* ]]; then
              # GitLab API: extract project path and URL-encode it
              PROJECT_PATH=$(echo "$TRACK_URL" | sed 's|https://gitlab.com/||')
              ENCODED_PATH=$(echo "$PROJECT_PATH" | sed 's|/|%2F|g')
              if RELEASE_DATA=$(curl -sf "https://gitlab.com/api/v4/projects/${ENCODED_PATH}/releases" 2>/dev/null); then
                LATEST=$(echo "$RELEASE_DATA" | jq -r '.[0].tag_name // empty')
              fi
              if [[ -z "$LATEST" ]]; then
                if TAG_DATA=$(curl -sf "https://gitlab.com/api/v4/projects/${ENCODED_PATH}/repository/tags?per_page=1" 2>/dev/null); then
                  LATEST=$(echo "$TAG_DATA" | jq -r '.[0].name // empty')
                fi
              fi
            elif [[ "$TRACK_URL" == *"bitbucket.org"* ]]; then
              # Bitbucket API: extract workspace/repo
              REPO_PATH=$(echo "$TRACK_URL" | sed 's|https://bitbucket.org/||')
              if TAG_DATA=$(curl -sf "https://api.bitbucket.org/2.0/repositories/${REPO_PATH}/refs/tags?sort=-target.date&pagelen=1" 2>/dev/null); then
                LATEST=$(echo "$TAG_DATA" | jq -r '.values[0].name // empty')
              fi
            else
              echo "Skipping ${ext}: unsupported URL ${TRACK_URL}"
              jq ".extensions.${ext}.last_checked = \"${CURRENT_TIME}\"" extensions.json > extensions.json.tmp && mv extensions.json.tmp extensions.json
              continue
            fi

            # Update last_checked timestamp
            jq ".extensions.${ext}.last_checked = \"${CURRENT_TIME}\"" extensions.json > extensions.json.tmp && mv extensions.json.tmp extensions.json

            if [[ -z "$LATEST" ]]; then
              echo "Warning: Could not get version for ${ext}"
              EXTENSIONS_CHECKED=$((EXTENSIONS_CHECKED + 1))
              continue
            fi

            # Get cached version from extensions.json
            CACHED=$(jq -r ".extensions.${ext}.latest_version // empty" extensions.json)

            if [[ "$LATEST" != "$CACHED" ]]; then
              # Update latest_version in extensions.json
              jq ".extensions.${ext}.latest_version = \"${LATEST}\"" extensions.json > extensions.json.tmp && mv extensions.json.tmp extensions.json
              UPDATES=$(echo "$UPDATES" | jq --arg ext "$ext" --arg ver "$LATEST" '. + [{"extension": $ext, "version": $ver}]')
              echo "Update found: ${ext} ${CACHED:-<none>} -> ${LATEST}"
            fi

            EXTENSIONS_CHECKED=$((EXTENSIONS_CHECKED + 1))
          done

          echo "updates=$(echo "$UPDATES" | jq -c)" >> $GITHUB_OUTPUT
          echo "Found $(echo "$UPDATES" | jq length) updates (checked ${EXTENSIONS_CHECKED} extensions)"

      - name: Commit extensions.json changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet extensions.json; then
            echo "No changes to commit"
            exit 0
          fi

          # Encode updated content
          CONTENT=$(base64 -w 0 extensions.json)

          MAX_RETRIES=3
          ATTEMPT=0
          while [[ $ATTEMPT -lt $MAX_RETRIES ]]; do
            ATTEMPT=$((ATTEMPT + 1))

            # Get current file SHA (re-fetch each attempt to avoid stale SHA)
            CURRENT_SHA=$(gh api repos/${{ github.repository }}/contents/extensions.json \
              --jq '.sha' 2>/dev/null || echo "")

            if [[ -z "$CURRENT_SHA" ]]; then
              echo "Error: could not fetch current SHA for extensions.json"
              exit 1
            fi

            # Attempt the update via Contents API
            if gh api -X PUT "repos/${{ github.repository }}/contents/extensions.json" \
              -f message="Update extension version checks" \
              -f content="$CONTENT" \
              -f sha="$CURRENT_SHA"; then
              echo "Successfully updated extensions.json on attempt $ATTEMPT"
              break
            fi

            if [[ $ATTEMPT -lt $MAX_RETRIES ]]; then
              echo "Attempt $ATTEMPT failed (likely 409 conflict), retrying..."
              sleep 2
            else
              echo "All $MAX_RETRIES attempts failed"
              exit 1
            fi
          done

      - name: Trigger releases for updated extensions
        if: steps.check.outputs.updates != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.check.outputs.updates }}' | jq -c '.[]' | while read -r update; do
            EXT=$(echo "$update" | jq -r '.extension')
            VER=$(echo "$update" | jq -r '.version')

            gh workflow run release.yml \
              -f extension="$EXT" \
              -f extension_version="$VER"
          done
